name: TDM build base

on:
  pull_request:
  push:
    branches: [main]
    tags: ['tdm-build-base/v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate image version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat tdm-build-base/VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::VERSION must be numeric X.Y.Z without leading zeros'
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "tdm-build-base/v$version" ]]; then
            echo '::error::Release tag must match tdm-build-base/VERSION'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test local build, publishing, and APT retry behavior
        run: |
          bash tests/test-build.sh
          bash tests/test-publish.sh
          bash tests/test-install-apt-packages-with-retries.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build dependency image
        uses: docker/build-push-action@v6
        with:
          context: ./tdm-build-base
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: tdm-build-base:ci
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tdm-build-base
          cache-to: type=gha,mode=max,scope=tdm-build-base
      - name: Verify versions, package loading, and synthetic calculations offline
        run: |
          docker run --rm --platform linux/amd64 --network none \
            -v "$PWD/tests/smoke.R:/tmp/smoke.R:ro" \
            tdm-build-base:ci Rscript --vanilla /tmp/smoke.R
      - name: Export the tested image for publishing
        if: github.ref_type == 'tag'
        run: docker save tdm-build-base:ci -o "$RUNNER_TEMP/tdm-build-base.tar"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: tdm-build-base
          path: ${{ runner.temp }}/tdm-build-base.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-tdm-build-base
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tdm-build-base
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: docker load -i "$RUNNER_TEMP/tdm-build-base.tar"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish an unused version and update latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/publish.sh "$VERSION" tdm-build-base:ci
